<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🌱Vitaminki_maryam🌱 – Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4faf4;
    --surface: #ffffff;
    --text: #1a2e1a;
    --muted: #6b8c6b;
    --accent: #3a8c4a;
    --accent2: #c8e6c9;
    --accent-light: #e8f5e9;
    --border: #d4e8d4;
    --danger: #c0392b;
    --gold: #f4a62a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 10px 16px 8px;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 4px;
    line-height: 1.2;
  }
  .logo-leaf { font-size: 17px; }
  .logo-name { color: var(--text); }
  .logo-name span { color: var(--accent); font-style: italic; }

  /* Location bar */
  .location-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    min-height: 16px;
    transition: color 0.2s;
  }
  .location-bar .loc-icon { font-size: 12px; flex-shrink: 0; }
  .location-bar .loc-text {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: calc(100vw - 120px);
  }
  .location-bar.loading .loc-text { color: #aaa; font-style: italic; }
  .location-bar.error .loc-text { color: #e07070; }
  .location-bar.ok .loc-text { color: var(--accent); font-weight: 500; }

  /* Search */
  .search-wrap {
    position: relative;
    margin-bottom: 0;
  }
  .search-icon {
    position: absolute;
    left: 11px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 14px;
    pointer-events: none;
    color: var(--muted);
  }
  .search-input {
    width: 100%;
    padding: 9px 36px 9px 34px;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .search-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(58,140,74,0.10);
  }
  .search-input::placeholder { color: #a0baa0; }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: var(--muted);
    border: none;
    color: white;
    width: 18px; height: 18px;
    border-radius: 50%;
    font-size: 11px;
    cursor: pointer;
    display: none;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }
  .search-clear.visible { display: flex; }

  .no-results {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-size: 15px;
    display: none;
  }
  .no-results.show { display: block; }
  .no-results-icon { font-size: 40px; margin-bottom: 12px; }

  .cart-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .cart-btn:active { background: #2e7a3a; }
  .cart-count {
    background: white;
    color: var(--accent);
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .categories {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 14px 12px;
  }

  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
    cursor: pointer;
  }
  .card:active { transform: scale(0.97); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--accent2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    overflow: hidden;
    position: relative;
  }
  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-body { padding: 10px 10px 12px; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .card-brand {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .card-price {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
  }
  .add-btn {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .add-btn.in-cart {
    background: var(--accent);
    color: white;
  }
  .badge {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--danger);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    z-index: 2;
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }
  .lightbox.open {
    opacity: 1;
    visibility: visible;
    pointer-events: all;
  }
  .lightbox-img {
    max-width: 100%;
    max-height: 60vh;
    border-radius: 16px;
    object-fit: contain;
  }
  .lightbox-name {
    color: white;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    margin-top: 16px;
    text-align: center;
  }
  .lightbox-close {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    z-index: 1;
  }

  /* ── Cart Panel ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
  }
  .overlay.open { display: block; }

  .cart-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px 32px;
    z-index: 201;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cart-panel.open { transform: translateY(0); }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .ci-thumb {
    width: 52px; height: 52px;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--accent2);
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
  }
  .ci-img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .ci-info { flex: 1; }
  .ci-name { font-size: 14px; font-weight: 500; }
  .ci-price { font-size: 13px; color: var(--accent); }
  .ci-qty { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .qty-num { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; }

  .empty-cart {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 15px;
  }

  .order-form { margin-top: 16px; }
  .form-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 6px;
    font-size: 16px;
    font-weight: 500;
  }
  .total-sum {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
  }

  .order-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.3px;
  }
  .order-btn:disabled { background: var(--muted); cursor: not-allowed; }
  .order-btn:active:not(:disabled) { background: #2e7a3a; }

  .success-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-screen.show { display: block; }
  .success-icon { font-size: 60px; margin-bottom: 16px; }
  .success-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .success-text { color: var(--muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>

  <div class="lightbox-name" id="lightboxName"></div>
</div>

<script>
// ── TELEGRAM INITIALIZATION ──────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('#f4faf4');
  tg.setBackgroundColor('#f4faf4');
}

const BRAND = "🌱Vitaminki_maryam🌱";
let userLocation = {};
let currentCategory = 'all';
let currentSearch = '';
let cart = [];

// ── PRODUCTS ─────────────────────────────────────────────────────
const products = [
  { id:1,  name:"NEWLINE Iodine",                           brand:BRAND, price:150000, image:"https://iili.io/BDPYQEu.jpg", cat:"yodlar",    sale:true },
  { id:2,  name:"VeNatura iYOT VA SELENYUM TOMCHISI",       brand:BRAND, price:140000, image:"https://iili.io/BDPGuGS.jpg", cat:"yodlar",    sale:true },
  { id:3,  name:"NBT life Iyotic Damla",                    brand:BRAND, price:155000, image:"https://iili.io/BDPhHqQ.jpg", cat:"yodlar",    sale:true },
  { id:6,  name:"AFNAN Beauty COLLAGEN",                    brand:BRAND, price:250000, image:"https://iili.io/BDPswBV.jpg", cat:"collagenlar", sale:true },
  { id:7,  name:"esila COLLAGEN DETOX",                     brand:BRAND, price:170000, image:"https://iili.io/BDPQtzG.jpg", cat:"collagenlar", sale:true },
  { id:9,  name:"Added Attention BURIED TREASURE",          brand:BRAND, price:380000, image:"https://iili.io/BDgJWSS.jpg", cat:"omega", sale:true },
  { id:21, name:"Swiss VITAMIN D3+K2",                      brand:BRAND, price:140000, image:"https://iili.io/BDLXJTX.jpg", cat:"d3", sale:true },
  { id:48, name:"H&B Calcium + Magnesium",                  brand:BRAND, price:270000, image:"https://iili.io/BDm7z4p.jpg", cat:"calcium", sale:true },
  { id:60, name:"CHLOROPHYLLIN ICHKI DEZODORANT",           brand:BRAND, price:100000, image:"https://iili.io/BbFx0aR.jpg", cat:"gozallik", sale:true },
  { id:71, name:"MAGNESIUM VITAMIN B6",                     brand:BRAND, price:200000, image:"https://iili.io/BbFGqOX.jpg", cat:"magniy", sale:true },
  { id:75, name:"Swiss B-COMPLEX SYRUP",                    brand:BRAND, price:150000, image:"https://iili.io/Bbyjg1e.jpg", cat:"complex", sale:true },
];

// ── DOM ELEMENTS ─────────────────────────────────────────────────
const productGrid = document.getElementById('productGrid');
const noResults = document.getElementById('noResults');
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const cartCount = document.getElementById('cartCount');
const cartPanel = document.getElementById('cartPanel');
const overlay = document.getElementById('overlay');
const cartItems = document.getElementById('cartItems');
const orderForm = document.getElementById('orderForm');
const orderBtn = document.getElementById('orderBtn');
const successScreen = document.getElementById('successScreen');
const cartContent = document.getElementById('cartContent');
const cartOpenBtn = document.getElementById('cartOpenBtn');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');
const lightboxName = document.getElementById('lightboxName');
const lightboxClose = document.getElementById('lightboxClose');

// ── GEOLOCATION ──────────────────────────────────────────────────
function requestLocation() {
  const bar = document.getElementById('locationBar');
  const barText = document.getElementById('locationText');
  
  bar.className = 'location-bar loading';
  barText.textContent = 'Joylashuv aniqlanmoqda…';

  if (!navigator.geolocation) {
    bar.className = 'location-bar error';
    barText.textContent = 'GPS qo\'llab-quvvatlanmaydi';
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = Number(pos.coords.latitude.toFixed(6));
      const lng = Number(pos.coords.longitude.toFixed(6));
      userLocation = { lat, lng };
      bar.className = 'location-bar ok';
      barText.textContent = '📍 ' + lat + ', ' + lng;
    },
    (err) => {
      bar.className = 'location-bar error';
      barText.textContent = 'Joylashuv aniqlanmadi';
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

window.addEventListener('load', requestLocation);

// ── RENDER PRODUCTS ──────────────────────────────────────────────
function renderProducts() {
  let filtered = products.filter(p => {
    const matchCat = currentCategory === 'all' || p.cat === currentCategory;
    const matchSearch = !currentSearch || 
      p.name.toLowerCase().includes(currentSearch) || 
      p.brand.toLowerCase().includes(currentSearch);
    return matchCat && matchSearch;
  });

  productGrid.innerHTML = '';

  if (filtered.length === 0) {
    noResults.classList.add('show');
    return;
  }

  noResults.classList.remove('show');

  filtered.forEach(product => {
    const inCart = cart.some(item => item.id === product.id);
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="card-img" onclick="openLightbox(${product.id})">
        <img src="${product.image}" alt="${product.name}" onerror="this.style.display='none'">
        ${product.sale ? `<div class="badge">SALE</div>` : ''}
      </div>
      <div class="card-body">
        <div class="card-name">${product.name}</div>
        <div class="card-brand">${product.brand}</div>
        <div class="card-price">${product.price.toLocaleString()} so'm</div>
        <button class="add-btn ${inCart ? 'in-cart' : ''}" onclick="toggleProductCart(${product.id}, event)">
          ${inCart ? '✓ Savatda' : '+ Qo\'shish'}
        </button>
      </div>
    `;
    productGrid.appendChild(card);
  });
}

// ── CART MANAGEMENT ──────────────────────────────────────────────
function toggleProductCart(id, event) {
  event.stopPropagation();
  const product = products.find(p => p.id === id);
  const existing = cart.find(item => item.id === id);
  
  if (existing) {
    existing.qty++;
  } else {
    cart.push({ ...product, qty: 1 });
  }
  
  renderProducts();
  updateCartUI();
}

function updateCartUI() {
  cartCount.textContent = cart.reduce((sum, item) => sum + item.qty, 0);
  
  if (cart.length === 0) {
    cartItems.innerHTML = '<div class="empty-cart">Savat bo\'sh</div>';
    orderForm.style.display = 'none';
    return;
  }
  
  cartItems.innerHTML = cart.map(item => `
    <div class="cart-item">
      <div class="ci-thumb">
        <img class="ci-img" src="${item.image}" alt="${item.name}" onerror="this.style.display='none'">
      </div>
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${item.price.toLocaleString()} so'm</div>
      </div>
      <div class="ci-qty">
        <button class="qty-btn" onclick="updateQty(${item.id}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
      </div>
    </div>
  `).join('');
  
  const total = cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  document.getElementById('totalSum').textContent = total.toLocaleString() + ' so'm';
  orderForm.style.display = 'block';
}

function updateQty(id, change) {
  const item = cart.find(i => i.id === id);
  if (item) {
    item.qty += change;
    if (item.qty <= 0) {
      cart = cart.filter(i => i.id !== id);
    }
    renderProducts();
    updateCartUI();
  }
}

// ── LIGHTBOX ─────────────────────────────────────────────────────
let currentLightboxId = null;

function openLightbox(id) {
  const product = products.find(p => p.id === id);
  if (!product) return;
  
  currentLightboxId = id;
  lightboxImg.src = product.image;
  lightboxName.textContent = product.name;
  lightbox.classList.add('open');
}

function closeLightbox() {
  lightbox.classList.remove('open');
  currentLightboxId = null;
}

// ── CART PANEL ───────────────────────────────────────────────────
function toggleCartPanel() {
  cartPanel.classList.toggle('open');
  overlay.classList.toggle('open');
}

// ── ORDER SUBMISSION ─────────────────────────────────────────────
function submitOrder() {
  const phone = document.getElementById('phoneInput').value.trim();
  const address = document.getElementById('addressInput').value.trim();
  
  if (!phone || !address) {
    alert('Telefon va manzilni to\'ldiring');
    return;
  }
  
  const orderData = {
    timestamp: new Date().toISOString(),
    phone,
    address,
    location: userLocation,
    items: cart.map(({ id, name, price, qty }) => ({ id, name, price, qty })),
    total: cart.reduce((sum, item) => sum + item.price * item.qty, 0)
  };
  
  console.log('Order:', orderData);
  
  // Send to Telegram
  if (tg) {
    tg.sendData(JSON.stringify(orderData));
  } else {
    alert('Order placed: ' + JSON.stringify(orderData));
  }
  
  cartContent.style.display = 'none';
  successScreen.classList.add('show');
  
  setTimeout(() => {
    cart = [];
    currentSearch = '';
    currentCategory = 'all';
    searchInput.value = '';
    cartPanel.classList.remove('open');
    overlay.classList.remove('open');
    cartContent.style.display = 'block';
    successScreen.classList.remove('show');
    renderProducts();
    updateCartUI();
    document.getElementById('phoneInput').value = '';
    document.getElementById('addressInput').value = '';
  }, 2000);
}

// ── EVENT LISTENERS ──────────────────────────────────────────────
searchInput.addEventListener('input', (e) => {
  currentSearch = e.target.value.toLowerCase();
  searchClear.classList.toggle('visible', currentSearch.length > 0);
  renderProducts();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  currentSearch = '';
  searchClear.classList.remove('visible');
  renderProducts();
});

document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.cat;
    renderProducts();
  });
});

cartOpenBtn.addEventListener('click', toggleCartPanel);
overlay.addEventListener('click', toggleCartPanel);
lightboxClose.addEventListener('click', closeLightbox);
lightbox.addEventListener('click', (e) => {
  if (e.target === lightbox) closeLightbox();
});
orderBtn.addEventListener('click', submitOrder);

// ── INITIALIZATION ───────────────────────────────────────────────
renderProducts();
updateCartUI();
</script>
</body>
</html>
