<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🌱Vitaminki_maryam🌱 – Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f4faf4;
    --surface: #ffffff;
    --text: #1a2e1a;
    --muted: #6b8c6b;
    --accent: #3a8c4a;
    --accent2: #c8e6c9;
    --accent-light: #e8f5e9;
    --border: #d4e8d4;
    --danger: #c0392b;
    --gold: #f4a62a;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 4px;
    line-height: 1.2;
  }
  .logo-leaf { font-size: 17px; }
  .logo-name { color: var(--text); }
  .logo-name span { color: var(--accent); font-style: italic; }

  .cart-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .cart-btn:hover { background: #2e7a3a; }
  .cart-count {
    background: white;
    color: var(--accent);
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  .categories {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 14px 12px;
  }

  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .card:active { transform: scale(0.97); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--accent2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 48px;
    overflow: hidden;
    position: relative;
  }
  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img .emoji-fallback {
    font-size: 48px;
    display: none;
  }
  .card-body { padding: 10px 10px 12px; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .card-brand {
    font-size: 10px;
    color: var(--muted);
    margin-bottom: 8px;
    letter-spacing: 0.3px;
  }
  .card-price {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
  }
  .card-old-price {
    font-size: 12px;
    color: var(--muted);
    text-decoration: line-through;
    margin-left: 4px;
  }
  .add-btn {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .add-btn.in-cart {
    background: var(--accent);
    color: white;
  }
  .badge {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--danger);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    z-index: 2;
  }
  .badge-new {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--gold);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
    z-index: 2;
  }

  /* ── Zoom hint ── */
  .card-img.has-image {
    cursor: zoom-in;
  }
  .zoom-hint {
    position: absolute;
    bottom: 6px;
    right: 6px;
    font-size: 14px;
    background: rgba(0,0,0,0.35);
    border-radius: 6px;
    padding: 2px 5px;
    opacity: 0.85;
    pointer-events: none;
  }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.92);
    z-index: 999;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.22s ease, visibility 0.22s ease;
  }
  .lightbox.open {
    opacity: 1;
    visibility: visible;
    pointer-events: all;
  }
  .lightbox-img {
    max-width: 100%;
    max-height: 75vh;
    border-radius: 16px;
    object-fit: contain;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    animation: lbZoomIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes lbZoomIn {
    from { transform: scale(0.8); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }
  .lightbox-name {
    color: white;
    font-family: 'Playfair Display', serif;
    font-size: 18px;
    font-weight: 600;
    margin-top: 16px;
    text-align: center;
  }
  .lightbox-brand {
    color: #a0c8a0;
    font-size: 13px;
    margin-top: 4px;
    margin-bottom: 20px;
  }
  .lightbox-close {
    position: absolute;
    top: 16px; right: 16px;
    background: rgba(255,255,255,0.15);
    border: none;
    color: white;
    width: 40px; height: 40px;
    border-radius: 50%;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    backdrop-filter: blur(4px);
    transition: background 0.2s;
    z-index: 1;
  }
  .lightbox-close:hover { background: rgba(255,255,255,0.3); }
  .lightbox-add {
    padding: 12px 32px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .lightbox-add:hover { background: #2e7a3a; }
  .lightbox-add.in-cart { background: #27ae60; }

  /* ── Cart Panel ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
  }
  .overlay.open { display: block; }

  .cart-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px 32px;
    z-index: 201;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cart-panel.open { transform: translateY(0); }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .panel-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .ci-thumb {
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--accent2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
  }
  .ci-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    border-radius: 10px;
  }
  .ci-info { flex: 1; }
  .ci-name { font-size: 14px; font-weight: 500; }
  .ci-price { font-size: 13px; color: var(--accent); }
  .ci-qty { display: flex; align-items: center; gap: 8px; }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .qty-num { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; }

  .empty-cart {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 15px;
  }

  .order-form { margin-top: 16px; }
  .form-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 6px;
    font-size: 16px;
    font-weight: 500;
  }
  .total-sum {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
  }

  .delivery-note {
    background: #e8f5e9;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--accent);
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }

  .order-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.3px;
  }
  .order-btn:disabled { background: var(--muted); cursor: not-allowed; }
  .order-btn:hover:not(:disabled) { background: #2e7a3a; }

  .success-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-screen.show { display: block; }
  .success-icon { font-size: 60px; margin-bottom: 16px; }
  .success-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .success-text { color: var(--muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">
    <span class="logo-leaf">🌱</span>
    <span class="logo-name">Vitaminki_<span>maryam</span></span>
    <span class="logo-leaf">🌱</span>
  </div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Savat <span class="cart-count" id="cartCount">0</span>
  </button>
</div>

<!-- Categories -->
<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">Barchasi</button>

</div>

<!-- Product Grid -->
<div class="grid" id="productGrid"></div>

<!-- Cart Overlay -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<!-- Cart Panel -->
<div class="cart-panel" id="cartPanel">
  <div class="panel-handle"></div>
  <div id="cartContent">
    <div class="panel-title">🛒 Savatcham</div>
    <div id="cartItems"></div>
    <div class="order-form" id="orderForm" style="display:none">

        <span>Jami:</span>
        <span class="total-sum" id="totalSum">0 so'm</span>

      <input class="form-input" id="phoneInput" type="tel" placeholder="+998 90 000 00 00">

      <input class="form-input" id="addressInput" type="text" placeholder="Shahar, ko'cha, uy raqami">
      <label class="form-label">Izoh (ixtiyoriy)</label>
      <input class="form-input" id="commentInput" type="text" placeholder="Qo'shimcha ma'lumot...">
      <button class="order-btn" id="orderBtn" onclick="submitOrder()">✅ Buyurtma berish</button>
    </div>
  </div>
  <div class="success-screen" id="successScreen">
    <div class="success-icon">🎉</div>
    <div class="success-title">Buyurtma qabul qilindi!</div>
    <div class="success-text">Menejer tez orada siz bilan bog'lanadi.<br>Sog'lom va baquvvat bo'ling! 🌱💚</div>
  </div>
</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="lightboxBgClick(event)">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img class="lightbox-img" id="lightboxImg" src="" alt="">
  <div class="lightbox-name" id="lightboxName"></div>
  <div class="lightbox-brand">🌱Vitaminki_maryam🌱</div>
  <button class="lightbox-add" id="lightboxAddBtn" onclick="lightboxAddToCart()">+ Savatga qo'shish</button>
</div>

<script>
// Telegram WebApp init
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const BRAND = "🌱Vitaminki_maryam🌱";

const products = [
  // 💊 Vitaminlar
  { id:1,  name:"Vitamin C 1000mg",       brand:BRAND, price:85000,                   emoji:"🍋", image:"", cat:"vitamin",   sale:true  },
  { id:2,  name:"Vitamin D3 2000 IU",     brand:BRAND, price:95000,                   emoji:"☀️", image:"", cat:"vitamin"              },
  { id:3,  name:"Vitamin B12",            brand:BRAND, price:75000,  oldPrice:98000,  emoji:"💊", image:"", cat:"vitamin",   sale:true  },
  { id:4,  name:"Multivitamin Complex",   brand:BRAND, price:145000,                  emoji:"🌈", image:"", cat:"vitamin",   sale:true  },

  // 🪨 Minerallar
  { id:5,  name:"Magniy B6",              brand:BRAND, price:89000,                   emoji:"🪨", image:"", cat:"mineral"              },
  { id:6,  name:"Temir (Iron) 18mg",      brand:BRAND, price:72000,  oldPrice:90000,  emoji:"🔴", image:"", cat:"mineral",   sale:true  },
  { id:7,  name:"Kalsiy + Vitamin D",     brand:BRAND, price:98000,                   emoji:"🦷", image:"", cat:"mineral"              },
  { id:8,  name:"Sink (Zinc) 25mg",       brand:BRAND, price:65000,                   emoji:"⚪", image:"", cat:"mineral",   sale:true  },

  // 🐟 Omega & Yog'lar
  { id:9,  name:"BURIED TREASURE",                              brand:BRAND, price:380000, emoji:"🐟", image:"https://iili.io/BDgJWSS.jpg", cat:"omega", sale:true  },
  { id:10, name:"Focusvit Kids",                                brand:BRAND, price:210000, emoji:"💛", image:"https://iili.io/BDr64N2.jpg", cat:"omega"            },
  { id:11, name:"OMEGA 3",                                      brand:BRAND, price:270000, emoji:"🦐", image:"https://iili.io/BDrbXAg.jpg", cat:"omega", sale:true  },
  { id:12, name:"Balen OMEGA 3•6•9 SOFT",                       brand:BRAND, price:250000, emoji:"🦐", image:"https://iili.io/BD4qj2a.jpg", cat:"omega", sale:true  },
  { id:13, name:"Carlson kid's",                                brand:BRAND, price:330000, emoji:"🦐", image:"https://iili.io/BD4I3ua.jpg", cat:"omega", sale:true  },
  { id:14, name:"Norwitella Omega-3",                           brand:BRAND, price:300000, emoji:"🦐", image:"https://iili.io/BD4uZjs.jpg", cat:"omega", sale:true  },
  { id:15, name:"novomins KIDS OMEGA 3-6-9 + MULTI GUMMIES",   brand:BRAND, price:180000, emoji:"🦐", image:"https://iili.io/BD4aUnn.jpg", cat:"omega", sale:true  },
  { id:16, name:"Ausvit Norway Fish Oil",                       brand:BRAND, price:300000, emoji:"🦐", image:"https://iili.io/BD40dhP.jpg", cat:"omega", sale:true  },
  { id:17, name:"NORDIC BORK PURE OMEGA-3 NORWAY COD LIVER OIL", brand:BRAND, price:160000, emoji:"🦐", image:"https://iili.io/BD4Gdj2.jpg", cat:"omega", sale:true},
  { id:18, name:"Mini Drops DHA",                               brand:BRAND, price:160000, emoji:"🦐", image:"https://iili.io/BD4MD5G.jpg", cat:"omega", sale:true  },
  { id:19, name:"Ausvit Focus Formula KIDS",                    brand:BRAND, price:210000, emoji:"🦐", image:"https://iili.io/BD4WL9s.jpg", cat:"omega", sale:true  },
  { id:20, name:"now Omega-3 Fish Oil",                         brand:BRAND, price:180000, emoji:"🦐", image:"https://iili.io/BD4hjpa.jpg", cat:"omega", sale:true  },

  // 🛡️ Immunitet
  { id:21, name:"Echinacea Ekstrakti",    brand:BRAND, price:78000,                   emoji:"🌸", image:"", cat:"immunitet"            },
  { id:22, name:"Propolis + Asal",        brand:BRAND, price:92000,  oldPrice:115000, emoji:"🍯", image:"", cat:"immunitet", sale:true  },
  { id:23, name:"Probiotik Complex",      brand:BRAND, price:135000,                  emoji:"🦠", image:"", cat:"immunitet", isnew:true },

  // ✨ Go'zallik
  { id:24, name:"Kollagen Peptidlar",     brand:BRAND, price:185000, oldPrice:230000, emoji:"✨", image:"", cat:"gozallik",  sale:true  },
  { id:25, name:"Biotin 5000 mcg",        brand:BRAND, price:98000,                   emoji:"💇", image:"", cat:"gozallik"             },
  { id:26, name:"Gialuron Kislota",       brand:BRAND, price:145000,                  emoji:"💧", image:"", cat:"gozallik",  isnew:true },

  // ⚡ Energiya
  { id:27, name:"Koenzim Q10",            brand:BRAND, price:168000,                  emoji:"⚡", image:"", cat:"energiya"             },
  { id:28, name:"L-Karnitin 1000mg",      brand:BRAND, price:115000, oldPrice:145000, emoji:"🔥", image:"", cat:"energiya",  sale:true  },
  { id:29, name:"Ginseng Ekstrakti",      brand:BRAND, price:125000,                  emoji:"🌿", image:"", cat:"energiya",  isnew:true },
];

let cart = {};
let currentCat = 'all';

function fmt(n) {
  return n.toLocaleString('uz-UZ') + " so'm";
}

// ── Render Products ──────────────────────────────────────────────────────────
function renderProducts() {
  const grid = document.getElementById('productGrid');
  const filtered = currentCat === 'all' ? products : products.filter(p => p.cat === currentCat);

  grid.innerHTML = '';

  filtered.forEach(p => {
    const inCart = !!cart[p.id];

    // Card element
    const card = document.createElement('div');
    card.className = 'card';

    // Badge
    if (p.sale) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = 'SALE';
      card.appendChild(badge);
    } else if (p.isnew) {
      const badge = document.createElement('span');
      badge.className = 'badge-new';
      badge.textContent = 'YANGI';
      card.appendChild(badge);
    }

    // Image container
    const imgDiv = document.createElement('div');
    imgDiv.className = 'card-img' + (p.image ? ' has-image' : '');

    if (p.image) {
      const img = document.createElement('img');
      img.src = p.image;
      img.alt = p.name;
      img.addEventListener('error', function() {
        imgDiv.classList.remove('has-image');
        imgDiv.removeAttribute('data-id');
        imgDiv.onclick = null;
        imgDiv.innerHTML = '';
        imgDiv.textContent = p.emoji;
        const hint = imgDiv.querySelector('.zoom-hint');
        if (hint) hint.remove();
      });
      imgDiv.appendChild(img);

      const hint = document.createElement('span');
      hint.className = 'zoom-hint';
      hint.textContent = '🔍';
      imgDiv.appendChild(hint);

      imgDiv.style.cursor = 'zoom-in';
      imgDiv.dataset.id = p.id;
      imgDiv.addEventListener('click', function() {
        openLightbox(p.id);
      });
    } else {
      imgDiv.textContent = p.emoji;
    }

    card.appendChild(imgDiv);

    // Card body
    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML =
      '<div class="card-name">' + p.name + '</div>' +
      '<div class="card-brand">' + p.brand + '</div>' +
      '<div>' +
        '<span class="card-price">' + fmt(p.price) + '</span>' +
        (p.oldPrice ? '<span class="card-old-price">' + fmt(p.oldPrice) + '</span>' : '') +
      '</div>';

    const addBtn = document.createElement('button');
    addBtn.className = 'add-btn' + (inCart ? ' in-cart' : '');
    addBtn.textContent = inCart ? '✓ Savatda' : '+ Savatga';
    addBtn.addEventListener('click', function() {
      addToCart(p.id);
    });

    body.appendChild(addBtn);
    card.appendChild(body);
    grid.appendChild(card);
  });
}

// ── Filter ───────────────────────────────────────────────────────────────────
function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

// ── Cart ─────────────────────────────────────────────────────────────────────
function addToCart(id) {
  if (cart[id]) {
    cart[id].qty++;
  } else {
    const p = products.find(x => x.id === id);
    cart[id] = Object.assign({}, p, { qty: 1 });
  }
  updateCartUI();
  renderProducts();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  updateCartUI();
  renderProducts();
  renderCartItems();
}

function updateCartUI() {
  const total = Object.values(cart).reduce(function(s, i) { return s + i.qty; }, 0);
  document.getElementById('cartCount').textContent = total;
}

function renderCartItems() {
  const items = Object.values(cart);
  const el   = document.getElementById('cartItems');
  const form = document.getElementById('orderForm');

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-cart">🛒 Savat bo\'sh<br><small>Katalogdan mahsulot qo\'shing</small></div>';
    form.style.display = 'none';
    return;
  }

  el.innerHTML = '';
  items.forEach(function(item) {
    const row = document.createElement('div');
    row.className = 'cart-item';

    // Thumbnail
    const thumb = document.createElement('div');
    thumb.className = 'ci-thumb';

    if (item.image) {
      const img = document.createElement('img');
      img.className = 'ci-img';
      img.src = item.image;
      img.alt = item.name;
      img.addEventListener('error', function() {
        thumb.textContent = item.emoji;
      });
      thumb.appendChild(img);
    } else {
      thumb.textContent = item.emoji;
    }

    // Info
    const info = document.createElement('div');
    info.className = 'ci-info';
    info.innerHTML =
      '<div class="ci-name">' + item.name + '</div>' +
      '<div class="ci-price">' + fmt(item.price) + '</div>';

    // Qty controls
    const qtyDiv = document.createElement('div');
    qtyDiv.className = 'ci-qty';

    const minusBtn = document.createElement('button');
    minusBtn.className = 'qty-btn';
    minusBtn.textContent = '−';
    minusBtn.addEventListener('click', function() { changeQty(item.id, -1); });

    const qtyNum = document.createElement('span');
    qtyNum.className = 'qty-num';
    qtyNum.textContent = item.qty;

    const plusBtn = document.createElement('button');
    plusBtn.className = 'qty-btn';
    plusBtn.textContent = '+';
    plusBtn.addEventListener('click', function() { changeQty(item.id, +1); });

    qtyDiv.appendChild(minusBtn);
    qtyDiv.appendChild(qtyNum);
    qtyDiv.appendChild(plusBtn);

    row.appendChild(thumb);
    row.appendChild(info);
    row.appendChild(qtyDiv);
    el.appendChild(row);
  });

  const total    = items.reduce(function(s, i) { return s + i.price * i.qty; }, 0);
  const totalQty = items.reduce(function(s, i) { return s + i.qty; }, 0);

  document.getElementById('totalSum').textContent = fmt(total);
  document.getElementById('deliveryNote').style.display = totalQty >= 3 ? 'block' : 'none';
  form.style.display = 'block';
}

function toggleCart() {
  const panel   = document.getElementById('cartPanel');
  const overlay = document.getElementById('overlay');
  const isOpen  = panel.classList.contains('open');
  if (!isOpen) renderCartItems();
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

// ── Submit Order ──────────────────────────────────────────────────────────────
function submitOrder() {
  const phone   = document.getElementById('phoneInput').value.trim();
  const address = document.getElementById('addressInput').value.trim();

  if (!phone || !address) {
    if (tg) {
      tg.showAlert("Iltimos, telefon raqam va manzilni kiriting!");
    } else {
      alert("Iltimos, telefon raqam va manzilni kiriting!");
    }
    return;
  }

  const items = Object.values(cart).map(function(i) {
    return { id: i.id, name: i.name, price: i.price, qty: i.qty, image: i.image || '' };
  });
  const total = items.reduce(function(s, i) { return s + i.price * i.qty; }, 0);

  const data = JSON.stringify({
    items: items,
    total: total,
    phone: phone,
    address: address,
    comment: document.getElementById('commentInput').value.trim()
  });

  if (tg) {
    tg.sendData(data);
  } else {
    console.log("Order data:", data);
  }

  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('successScreen').classList.add('show');

  cart = {};
  updateCartUI();
  renderProducts();

  if (tg) {
    setTimeout(function() { tg.close(); }, 3000);
  }
}

// ── Lightbox ──────────────────────────────────────────────────────────────────
let lightboxProductId = null;

function openLightbox(id) {
  const p = products.find(function(x) { return x.id === id; });
  if (!p || !p.image) return;
  lightboxProductId = id;

  document.getElementById('lightboxImg').src = p.image;
  document.getElementById('lightboxName').textContent = p.name;

  const btn = document.getElementById('lightboxAddBtn');
  if (cart[id]) {
    btn.textContent = '✓ Savatda';
    btn.classList.add('in-cart');
  } else {
    btn.textContent = "+ Savatga qo'shish";
    btn.classList.remove('in-cart');
  }

  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  lightboxProductId = null;
}

// Faqat fon bosilganda yopilsin (ichidagi elementlar emas)
function lightboxBgClick(e) {
  if (e.target === document.getElementById('lightbox')) {
    closeLightbox();
  }
}

function lightboxAddToCart() {
  if (!lightboxProductId) return;
  addToCart(lightboxProductId);
  const btn = document.getElementById('lightboxAddBtn');
  btn.textContent = '✓ Savatda';
  btn.classList.add('in-cart');
}

// Escape tugmasi
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeLightbox();
});

// ── Init ──────────────────────────────────────────────────────────────────────
renderProducts();
</script>
</body>
</html>
