    --text: var(--tg-theme-text-color, #1a2e1a);

    --border: var(--tg-theme-secondary-bg-color, #d4e8d4);

  body {

    padding-bottom: 20px;

  .header {

    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 4px 20px var(--shadow);
  }
  .logo {

    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .logo-name { color: var(--text); }
  .logo-name span { color: var(--accent); font-style: italic; }

  .cart-btn {

    color: var(--accent-text);
    border: none;
    border-radius: 20px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;

    box-shadow: 0 4px 12px rgba(58, 140, 74, 0.3);
  }
  .cart-btn:active { transform: scale(0.95); }
  .cart-count {

    color: var(--accent);
    border-radius: 50%;
    width: 20px; height: 20px;
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;

  .search-input {

    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  .search-input:focus { border-color: var(--accent); }

  .categories {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    padding: 8px 18px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-text);
  }

  /* ── Product Grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 12px;
    padding: 16px;
  }
  .card {
    background: var(--surface);
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.2s, box-shadow 0.2s;
    position: relative;
    display: flex;
    flex-direction: column;
    box-shadow: 0 2px 10px var(--shadow);
  }
  .card:active { transform: scale(0.98); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 50px;
    position: relative;
    overflow: hidden;
  }
  .card-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
  }
  .card:hover .card-img img { transform: scale(1.05); }
  
  .card-body { padding: 12px; flex-grow: 1; display: flex; flex-direction: column; }
  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 4px;
    flex-grow: 1;
  }

  .price-wrap { display: flex; align-items: baseline; gap: 6px; margin-bottom: 10px; }
  .card-price { font-size: 16px; font-weight: 700; color: var(--text); }

    padding: 10px;
    border: none;
    border-radius: 10px;
    background: var(--accent-light);
    color: var(--accent);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .add-btn.in-cart { background: var(--accent); color: var(--accent-text); }
  .add-btn:active { transform: translateY(2px); }

  .badge { position: absolute; top: 10px; left: 10px; background: var(--danger); color: white; font-size: 10px; font-weight: 700; padding: 4px 8px; border-radius: 8px; z-index: 2; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
  .zoom-hint { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); border-radius: 8px; padding: 4px; font-size: 12px; color: white; pointer-events: none; }

  /* ── Lightbox ── */
  .lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
    z-index: 999; display: flex; align-items: center; justify-content: center; flex-direction: column;
    padding: 20px; opacity: 0; visibility: hidden; transition: 0.3s ease;
  }
  .lightbox.open { opacity: 1; visibility: visible; }
  .lightbox-img { max-width: 100%; max-height: 60vh; border-radius: 20px; object-fit: contain; transform: scale(0.9); transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1); }
  .lightbox.open .lightbox-img { transform: scale(1); }
  .lightbox-info { background: var(--surface); padding: 20px; border-radius: 20px; width: 100%; max-width: 400px; margin-top: 20px; text-align: center; }
  .lightbox-name { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; margin-bottom: 8px; color: var(--text); }
  .lightbox-close { position: absolute; top: 20px; right: 20px; background: rgba(255,255,255,0.2); border: none; color: white; width: 44px; height: 44px; border-radius: 50%; font-size: 18px; cursor: pointer; }

  /* ── Cart Panel ── */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; backdrop-filter: blur(2px); }
  .overlay.open { display: block; }
  .cart-panel {
    position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 24px 24px 0 0;

    transform: translateY(100%); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);

  .panel-title { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600; margin-bottom: 20px; }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  .empty-state text { display: block; font-size: 50px; margin-bottom: 10px; }
</style>

let cart = JSON.parse(localStorage.getItem('vitaminki_cart')) || {};
let currentCat = 'all';

function fmt(n) { return n.toLocaleString('uz-UZ') + " so'm"; }

// Savatni xotiraga saqlash
function saveCart() { localStorage.setItem('vitaminki_cart', JSON.stringify(cart)); }

// Toast Xabarnoma
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  if(window.navigator && window.navigator.vibrate) navigator.vibrate(50);
  setTimeout(() => t.classList.remove('show'), 2000);
}

// Kategoriyalarni chizish
function renderCategories() {
  const catContainer = document.getElementById('categories');
  catContainer.innerHTML = categories.map(c => 
    `<button class="cat-btn ${currentCat === c.id ? 'active' : ''}" onclick="filterCat('${c.id}')">${c.name}</button>`
  ).join('');
}

// Mahsulotlarni filtrlash va chizish
function filterProducts() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = products.filter(p => {
    const matchCat = currentCat === 'all' || p.cat === currentCat;
    const matchSearch = p.name.toLowerCase().includes(query);
    return matchCat && matchSearch;
  });

  const grid = document.getElementById('productGrid');
  
  if(filtered.length === 0) {
    grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; padding: 40px; color: var(--muted);">Hech narsa topilmadi 😔</div>`;
    return;
  }

  grid.innerHTML = filtered.map(p => {
    const inCart = !!cart[p.id];
    return `
      <div class="card">
        ${p.sale ? `<span class="badge">SALE</span>` : ''}
        <div class="card-img" ${p.image ? `style="cursor:zoom-in" onclick="openLightbox(${p.id})"` : ''}>
          ${p.image 
            ? `<img src="${p.image}" alt="${p.name}" onerror="this.outerHTML='${p.emoji}'"><span class="zoom-hint">🔍</span>` 
            : p.emoji}
        </div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-brand">${p.brand}</div>
          <div class="price-wrap">
            <span class="card-price">${fmt(p.price)}</span>
          </div>
          <button class="add-btn ${inCart ? 'in-cart' : ''}" onclick="addToCart(${p.id})">
            ${inCart ? '✓ Savatda' : '+ Savatga'}
          </button>
        </div>
      </div>
    `;
  }).join('');
}

function filterCat(cat) {
  currentCat = cat;
  renderCategories();
  filterProducts();
}

// Savat mantig'i
function addToCart(id) {
  if (cart[id]) cart[id].qty++;
  else {
    const p = products.find(x => x.id === id);
    cart[id] = { ...p, qty: 1 };
  }
  saveCart();
  updateCartUI();
  filterProducts();
  showToast("✅ Savatga qo'shildi!");
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  saveCart();
  updateCartUI();
  filterProducts();
  renderCartItems();
}

function updateCartUI() {
  const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = total;
  
  if(tg && tg.MainButton) {
    if(total > 0) {
      tg.MainButton.setText(`🛒 Savatga o'tish (${total})`);
      tg.MainButton.show();
      tg.MainButton.onClick(toggleCart);
    } else {
      tg.MainButton.hide();
    }
  }
}

function renderCartItems() {
  const items = Object.values(cart);
  const el = document.getElementById('cartItems');
  const form = document.getElementById('orderForm');

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-state"><text>🛒</text>Savat bo\'sh<br><small>Katalogdan mahsulot qo\'shing</small></div>';
    form.style.display = 'none';
    return;
  }

  el.innerHTML = items.map(item => `
    <div class="cart-item">
      <img class="ci-thumb" src="${item.image || ''}" onerror="this.style.display='none'">
      <div class="ci-info">
        <div class="ci-name">${item.name}</div>
        <div class="ci-price">${fmt(item.price)}</div>
      </div>
      <div class="ci-qty">
        <button class="qty-btn" onclick="changeQty(${item.id}, -1)">−</button>
        <span class="qty-num">${item.qty}</span>
        <button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button>
      </div>
    </div>
  `).join('');

  const totalSum = items.reduce((s, i) => s + i.price * i.qty, 0);
  document.getElementById('totalSum').textContent = fmt(totalSum);
  form.style.display = 'block';
}

function toggleCart() {
  const panel = document.getElementById('cartPanel');
  const overlay = document.getElementById('overlay');
  if (!panel.classList.contains('open')) renderCartItems();
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

// Buyurtma berish
function submitOrder() {
  const phone = document.getElementById('phoneInput').value.trim();
  const address = document.getElementById('addressInput').value.trim();

  if (!phone || !address) {
    if (tg) tg.showAlert("Iltimos, telefon raqam va manzilni kiriting!");
    else alert("Iltimos, telefon raqam va manzilni kiriting!");
    return;
  }

  const items = Object.values(cart).map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty }));
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);

  const data = JSON.stringify({
    items, total, phone, address,
    comment: document.getElementById('commentInput').value.trim()
  });

  if (tg) tg.sendData(data);
  else console.log("Order data:", data);

  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('successScreen').style.display = 'block';

  cart = {};
  saveCart();
  updateCartUI();
  filterProducts();

  if (tg) setTimeout(() => tg.close(), 3000);
}

// Lightbox (Rasm kattalashtirish)
let currentLightboxId = null;
function openLightbox(id) {
  const p = products.find(x => x.id === id);
  if (!p || !p.image) return;
  currentLightboxId = id;
  
  document.getElementById('lightboxImg').src = p.image;
  document.getElementById('lightboxName').textContent = p.name;
  
  const btn = document.getElementById('lightboxAddBtn');
  btn.textContent = cart[id] ? '✓ Savatda' : "+ Savatga qo'shish";
  
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  currentLightboxId = null;
}

function lightboxAddToCart() {
  if (currentLightboxId) addToCart(currentLightboxId);
  closeLightbox();
}

// Boshlang'ich yuklash
renderCategories();
filterProducts();
updateCartUI();
</script>
