<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Beautylish – Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf8f5;
    --surface: #ffffff;
    --text: #1a1208;
    --muted: #8c7b6b;
    --accent: #c4956a;
    --accent2: #e8d5c0;
    --border: #ede8e1;
    --danger: #c0392b;
    --green: #27ae60;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.5px;
    color: var(--text);
  }
  .logo span { color: var(--accent); font-style: italic; }
  .cart-btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 7px 14px;
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: background 0.2s;
  }
  .cart-btn:hover { background: #b07d52; }
  .cart-count {
    background: white;
    color: var(--accent);
    border-radius: 50%;
    width: 18px; height: 18px;
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── Categories ── */
  .categories {
    display: flex;
    gap: 8px;
    padding: 12px 16px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  .categories::-webkit-scrollbar { display: none; }
  .cat-btn {
    white-space: nowrap;
    padding: 7px 16px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: white;
  }

  /* ── Product Grid ── */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    padding: 14px 12px;
  }

  .card {
    background: var(--surface);
    border-radius: 14px;
    overflow: hidden;
    border: 1px solid var(--border);
    transition: transform 0.15s, box-shadow 0.15s;
    position: relative;
  }
  .card:active { transform: scale(0.97); }

  .card-img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    background: var(--accent2);
    display: flex; align-items: center; justify-content: center;
    font-size: 48px;
  }
  .card-body { padding: 10px 10px 12px; }
  .card-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.3;
    margin-bottom: 3px;
  }
  .card-brand {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .card-price {
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
  }
  .card-old-price {
    font-size: 12px;
    color: var(--muted);
    text-decoration: line-through;
    margin-left: 4px;
  }
  .add-btn {
    width: 100%;
    margin-top: 8px;
    padding: 8px;
    border: 1.5px solid var(--accent);
    border-radius: 8px;
    background: transparent;
    color: var(--accent);
    font-size: 13px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
  }
  .add-btn.in-cart {
    background: var(--accent);
    color: white;
  }
  .badge {
    position: absolute;
    top: 8px; left: 8px;
    background: var(--danger);
    color: white;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 10px;
  }

  /* ── Cart Panel ── */
  .overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.4);
    z-index: 200;
  }
  .overlay.open { display: block; }

  .cart-panel {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: var(--surface);
    border-radius: 24px 24px 0 0;
    padding: 20px 16px 32px;
    z-index: 201;
    max-height: 85vh;
    overflow-y: auto;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .cart-panel.open { transform: translateY(0); }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 2px;
    margin: 0 auto 16px;
  }
  .panel-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
  }

  .cart-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .ci-emoji { font-size: 32px; flex-shrink: 0; }
  .ci-info { flex: 1; }
  .ci-name { font-size: 14px; font-weight: 500; }
  .ci-price { font-size: 13px; color: var(--accent); }
  .ci-qty {
    display: flex; align-items: center; gap: 8px;
  }
  .qty-btn {
    width: 28px; height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--border);
    background: transparent;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: var(--text);
  }
  .qty-num { font-size: 14px; font-weight: 500; min-width: 20px; text-align: center; }

  .empty-cart {
    text-align: center;
    padding: 40px 0;
    color: var(--muted);
    font-size: 15px;
  }

  /* ── Order Form ── */
  .order-form { margin-top: 16px; }
  .form-label {
    font-size: 12px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
    display: block;
  }
  .form-input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    margin-bottom: 10px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-input:focus { border-color: var(--accent); }

  .total-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 0 6px;
    font-size: 16px;
    font-weight: 500;
  }
  .total-sum {
    font-family: 'Cormorant Garamond', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--accent);
  }

  .delivery-note {
    background: #eafaf1;
    border-radius: 8px;
    padding: 8px 12px;
    font-size: 12px;
    color: var(--green);
    margin-bottom: 12px;
  }

  .order-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-size: 16px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
    letter-spacing: 0.3px;
  }
  .order-btn:disabled { background: var(--muted); cursor: not-allowed; }
  .order-btn:hover:not(:disabled) { background: #b07d52; }

  /* ── Success ── */
  .success-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }
  .success-screen.show { display: block; }
  .success-icon { font-size: 60px; margin-bottom: 16px; }
  .success-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .success-text { color: var(--muted); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="logo">Beauty<span>lish</span></div>
  <button class="cart-btn" onclick="toggleCart()">
    🛒 Savat <span class="cart-count" id="cartCount">0</span>
  </button>
</div>

<!-- Categories -->
<div class="categories">
  <button class="cat-btn active" onclick="filterCat('all', this)">Barchasi</button>
  <button class="cat-btn" onclick="filterCat('yuz', this)">💆 Yuz parvarishi</button>
  <button class="cat-btn" onclick="filterCat('soch', this)">💇 Soch parvarishi</button>
  <button class="cat-btn" onclick="filterCat('parfum', this)">🌸 Parfyumeriya</button>
  <button class="cat-btn" onclick="filterCat('makiyaj', this)">💄 Makiyaj</button>
  <button class="cat-btn" onclick="filterCat('tana', this)">🧴 Tana parvarishi</button>
</div>

<!-- Product Grid -->
<div class="grid" id="productGrid"></div>

<!-- Cart Overlay -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>

<!-- Cart Panel -->
<div class="cart-panel" id="cartPanel">
  <div class="panel-handle"></div>
  <div id="cartContent">
    <div class="panel-title">🛒 Savatcham</div>
    <div id="cartItems"></div>

    <div class="order-form" id="orderForm" style="display:none">
      <div class="total-row">
        <span>Jami:</span>
        <span class="total-sum" id="totalSum">0 so'm</span>
      </div>
      <div class="delivery-note" id="deliveryNote" style="display:none">
        🚚 3 ta mahsulot bor — Yetkazib berish BEPUL!
      </div>
      <label class="form-label">Telefon raqam *</label>
      <input class="form-input" id="phoneInput" type="tel" placeholder="+998 90 000 00 00">
      <label class="form-label">Manzil *</label>
      <input class="form-input" id="addressInput" type="text" placeholder="Shahar, ko'cha, uy raqami">
      <label class="form-label">Izoh (ixtiyoriy)</label>
      <input class="form-input" id="commentInput" type="text" placeholder="Qo'shimcha ma'lumot...">
      <button class="order-btn" id="orderBtn" onclick="submitOrder()">✅ Buyurtma berish</button>
    </div>
  </div>

  <!-- Success Screen -->
  <div class="success-screen" id="successScreen">
    <div class="success-icon">🎉</div>
    <div class="success-title">Buyurtma qabul qilindi!</div>
    <div class="success-text">Menejer tez orada siz bilan bog'lanadi.<br>Rahmat va xaridingiz uchun minnatdormiz! 💕</div>
  </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

// ── Products Data ───────────────────────────────────────────────────────────
const products = [
  { id:1, name:"Hydra Boost Krem", brand:"CeraVe", price:89000, oldPrice:120000, emoji:"💧", cat:"yuz", sale:true },
  { id:2, name:"Vitamin C Serum", brand:"The Ordinary", price:145000, emoji:"✨", cat:"yuz" },
  { id:3, name:"Retinol Eye Krem", brand:"Olay", price:210000, oldPrice:280000, emoji:"👁", cat:"yuz", sale:true },
  { id:4, name:"Niacinamide 10%", brand:"The Ordinary", price:95000, emoji:"🧪", cat:"yuz" },
  { id:5, name:"Argan Oil Shampun", brand:"Moroccanoil", price:175000, emoji:"🌿", cat:"soch" },
  { id:6, name:"Keratin Maska", brand:"Schwarzkopf", price:130000, oldPrice:165000, emoji:"💆", cat:"soch", sale:true },
  { id:7, name:"La Vie Est Belle", brand:"Lancôme", price:890000, emoji:"🌸", cat:"parfum" },
  { id:8, name:"Black Opium EDP", brand:"YSL", price:1100000, emoji:"🖤", cat:"parfum" },
  { id:9, name:"Lipstick Matte", brand:"MAC", price:145000, emoji:"💄", cat:"makiyaj" },
  { id:10, name:"Foundation SPF", brand:"Fenty Beauty", price:320000, oldPrice:395000, emoji:"🎨", cat:"makiyaj", sale:true },
  { id:11, name:"Body Lotion", brand:"Nivea", price:65000, emoji:"🧴", cat:"tana" },
  { id:12, name:"Rose Body Scrub", brand:"The Body Shop", price:185000, emoji:"🌹", cat:"tana" },
];

let cart = {};
let currentCat = 'all';

function fmt(n) { return n.toLocaleString('uz-UZ') + ' so\'m'; }

// ── Render Products ─────────────────────────────────────────────────────────
function renderProducts() {
  const grid = document.getElementById('productGrid');
  const filtered = currentCat === 'all' ? products : products.filter(p => p.cat === currentCat);
  grid.innerHTML = filtered.map(p => {
    const inCart = cart[p.id] ? true : false;
    return `
      <div class="card">
        ${p.sale ? '<span class="badge">SALE</span>' : ''}
        <div class="card-img">${p.emoji}</div>
        <div class="card-body">
          <div class="card-name">${p.name}</div>
          <div class="card-brand">${p.brand}</div>
          <div>
            <span class="card-price">${fmt(p.price)}</span>
            ${p.oldPrice ? `<span class="card-old-price">${fmt(p.oldPrice)}</span>` : ''}
          </div>
          <button class="add-btn ${inCart ? 'in-cart' : ''}" onclick="addToCart(${p.id})">
            ${inCart ? '✓ Savatda' : '+ Savatga'}
          </button>
        </div>
      </div>`;
  }).join('');
}

// ── Filter ──────────────────────────────────────────────────────────────────
function filterCat(cat, btn) {
  currentCat = cat;
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderProducts();
}

// ── Cart ────────────────────────────────────────────────────────────────────
function addToCart(id) {
  const p = products.find(x => x.id === id);
  if (cart[id]) {
    cart[id].qty++;
  } else {
    cart[id] = { ...p, qty: 1 };
  }
  updateCartUI();
  renderProducts();
}

function changeQty(id, delta) {
  if (!cart[id]) return;
  cart[id].qty += delta;
  if (cart[id].qty <= 0) delete cart[id];
  updateCartUI();
  renderProducts();
  renderCartItems();
}

function updateCartUI() {
  const total = Object.values(cart).reduce((s, i) => s + i.qty, 0);
  document.getElementById('cartCount').textContent = total;
}

function renderCartItems() {
  const items = Object.values(cart);
  const el = document.getElementById('cartItems');
  const form = document.getElementById('orderForm');

  if (items.length === 0) {
    el.innerHTML = '<div class="empty-cart">🛒 Savat bo\'sh<br><small>Katalogdan mahsulot qo\'shing</small></div>';
    form.style.display = 'none';
    return;
  }

  el.innerHTML = items.map(i => `
    <div class="cart-item">
      <div class="ci-emoji">${i.emoji}</div>
      <div class="ci-info">
        <div class="ci-name">${i.name}</div>
        <div class="ci-price">${fmt(i.price)}</div>
      </div>
      <div class="ci-qty">
        <button class="qty-btn" onclick="changeQty(${i.id}, -1)">−</button>
        <span class="qty-num">${i.qty}</span>
        <button class="qty-btn" onclick="changeQty(${i.id}, +1)">+</button>
      </div>
    </div>
  `).join('');

  const total = items.reduce((s, i) => s + i.price * i.qty, 0);
  const totalQty = items.reduce((s, i) => s + i.qty, 0);
  document.getElementById('totalSum').textContent = fmt(total);
  document.getElementById('deliveryNote').style.display = totalQty >= 3 ? 'block' : 'none';
  form.style.display = 'block';
}

function toggleCart() {
  const panel = document.getElementById('cartPanel');
  const overlay = document.getElementById('overlay');
  const isOpen = panel.classList.contains('open');
  if (!isOpen) renderCartItems();
  panel.classList.toggle('open');
  overlay.classList.toggle('open');
}

// ── Submit Order ─────────────────────────────────────────────────────────────
function submitOrder() {
  const phone = document.getElementById('phoneInput').value.trim();
  const address = document.getElementById('addressInput').value.trim();

  if (!phone || !address) {
    tg.showAlert("Iltimos, telefon raqam va manzilni kiriting!");
    return;
  }

  const items = Object.values(cart).map(i => ({
    id: i.id, name: i.name, price: i.price, qty: i.qty
  }));
  const total = items.reduce((s, i) => s + i.price * i.qty, 0);

  const data = {
    items,
    total,
    phone,
    address,
    comment: document.getElementById('commentInput').value.trim()
  };

  // Send to bot
  tg.sendData(JSON.stringify(data));

  // Show success
  document.getElementById('cartContent').style.display = 'none';
  document.getElementById('successScreen').classList.add('show');

  // Reset
  cart = {};
  updateCartUI();
  renderProducts();

  setTimeout(() => tg.close(), 3000);
}

// ── Init ────────────────────────────────────────────────────────────────────
renderProducts();
</script>
</body>
</html>
